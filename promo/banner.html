<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #132019;
    background:
      radial-gradient(900px 500px at 88% 18%, rgba(137, 210, 179, .42), transparent 65%),
      radial-gradient(700px 700px at 8% 90%, rgba(243, 216, 143, .28), transparent 70%),
      #f6f8f5;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(31, 71, 52, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(31, 71, 52, .045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 50%, black, transparent 82%);
  }
  .top { position: absolute; left: 80px; top: 62px; display: flex; align-items: center; gap: 14px; }
  .logo { width: 46px; height: 46px; border-radius: 13px; box-shadow: 0 12px 32px rgba(20, 80, 54, .18); }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: .06em; }
  .brand small { margin-left: 4px; color: #8b9a90; font-size: 10px; letter-spacing: .22em; font-weight: 700; }
  .content { position: absolute; left: 80px; top: 190px; width: 660px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; height: 29px; padding: 0 12px; border: 1px solid rgba(27, 130, 91, .2); border-radius: 99px; background: rgba(255,255,255,.55); color: #167a55; font-size: 11px; font-weight: 750; letter-spacing: .08em; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #20a877; box-shadow: 0 0 0 4px rgba(32,168,119,.12); }
  h1 { margin: 26px 0 18px; font-size: 83px; line-height: .98; letter-spacing: -.07em; font-weight: 850; }
  h1 em { color: #168a60; font-style: normal; }
  .lead { margin: 0; width: 560px; color: #596b60; font-size: 18px; line-height: 1.85; }
  .pills { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 30px; width: 580px; }
  .pill { padding: 9px 12px; border-radius: 9px; border: 1px solid rgba(22, 94, 66, .12); background: rgba(255,255,255,.65); color: #365846; font-size: 11px; font-weight: 650; }
  .foot { position: absolute; left: 80px; bottom: 62px; display: flex; align-items: center; gap: 16px; color: #60766a; font-size: 12px; }
  .foot b { color: #1e3d2e; font-weight: 750; }
  .shot-wrap { position: absolute; right: -88px; top: 148px; width: 920px; transform: rotate(-2.2deg); }
  .shot-frame { padding: 13px; border-radius: 22px; background: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 45px 90px rgba(27, 67, 49, .23), 0 8px 24px rgba(27, 67, 49, .1); }
  .shot-frame img { display: block; width: 100%; border-radius: 14px; }
  .glow { position: absolute; right: 90px; top: 92px; width: 460px; height: 460px; background: rgba(60, 190, 140, .22); filter: blur(80px); border-radius: 50%; }
  .version { position: absolute; right: 96px; bottom: 56px; color: #7b8c82; font-size: 11px; letter-spacing: .16em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="top">
    <img class="logo" src="../src/assets/icon-128.png" alt="">
    <div class="brand">TYCL <small>LAUNCHER</small></div>
  </div>
  <div class="content">
    <div class="eyebrow"><span class="dot"></span> TYCL 1.2.0 · WINDOWS</div>
    <h1>世界，就在<br>下一次<em>点击</em></h1>
    <p class="lead">简洁、安静的 Minecraft 启动器。安装、实例、Mod、皮肤与更新，收在一个刚刚好的地方。</p>
    <div class="pills">
      <span class="pill">版本隔离</span>
      <span class="pill">下载续传</span>
      <span class="pill">实例备份</span>
      <span class="pill">Mod 更新</span>
      <span class="pill">崩溃分析</span>
      <span class="pill">新闻汉化</span>
    </div>
  </div>
  <div class="shot-wrap"><div class="shot-frame"><img src="../screenshots/home.png" alt=""></div></div>
  <div class="foot"><span><b>github.com/youwu2025a3-del/TYCL</b></span><span>MIT · 开源</span><span>制作者 A3Y8</span></div>
  <div class="version">MINECRAFT JAVA EDITION</div>
</body>
</html>
