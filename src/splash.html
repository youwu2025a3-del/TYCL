<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>TYCL</title>
  <link rel="stylesheet" href="./css/splash.css">
</head>
<body>
  <div class="splash-shell">
    <div class="splash-noise"></div>
    <div class="splash-orb orb-a"></div>
    <div class="splash-orb orb-b"></div>
    <div class="pixel pixel-a"></div>
    <div class="pixel pixel-b"></div>
    <div class="pixel pixel-c"></div>
    <div class="splash-center">
      <div class="brand-mark">
        <svg class="ty-art" viewBox="0 0 360 150" aria-hidden="true">
          <defs>
            <linearGradient id="block" x1="70" y1="30" x2="250" y2="130" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2BB78C"/>
              <stop offset="1" stop-color="#0E6E53"/>
            </linearGradient>
          </defs>
          <g fill="url(#block)" class="letter letter-t">
            <rect x="28" y="24" width="124" height="22" rx="4"/>
            <rect x="78" y="24" width="24" height="102" rx="4"/>
            <rect x="50" y="46" width="24" height="14" rx="3" opacity=".5"/>
          </g>
          <g fill="url(#block)" class="letter letter-y">
            <rect x="198" y="24" width="24" height="50" rx="4"/>
            <rect x="276" y="24" width="24" height="50" rx="4"/>
            <rect x="216" y="58" width="66" height="22" rx="4"/>
            <rect x="237" y="74" width="24" height="52" rx="4"/>
            <rect x="198" y="24" width="10" height="10" fill="#8DE0BE" opacity=".5"/>
          </g>
        </svg>
      </div>
      <div class="splash-title">TYCL <span>LAUNCHER</span></div>
      <div class="splash-sub">正在准备你的世界<span class="ellipsis"><i>.</i><i>.</i><i>.</i></span></div>
      <div class="loading-line"><span></span></div>
    </div>
    <div class="splash-footer">
      <span>MINECRAFT · JAVA EDITION</span>
      <span>BY A3Y8</span>
    </div>
  </div>
</body>
</html>
